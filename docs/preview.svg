<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui,-apple-system,'Segoe UI','Noto Sans SC',sans-serif">
  <!-- 背景 -->
  <rect width="680" height="420" rx="12" fill="#f6f8fa"/>
  <!-- 浏览器窗口 -->
  <rect x="24" y="24" width="632" height="352" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="24" y="24" width="632" height="34" rx="10" fill="#eaeef2"/>
  <rect x="24" y="48" width="632" height="10" fill="#eaeef2"/>
  <circle cx="46" cy="41" r="5" fill="#f85149"/>
  <circle cx="62" cy="41" r="5" fill="#d29922"/>
  <circle cx="78" cy="41" r="5" fill="#57ab5a"/>
  <rect x="110" y="32" width="380" height="18" rx="9" fill="#ffffff" stroke="#d0d7de"/>
  <text x="122" y="45" font-size="10" fill="#8b949e">example-search.com/s?q=热销好物</text>

  <!-- 搜索框 -->
  <rect x="44" y="74" width="400" height="26" rx="13" stroke="#d0d7de" fill="#fff"/>
  <text x="58" y="91" font-size="12" fill="#1f2328">热销好物</text>
  <rect x="454" y="74" width="60" height="26" rx="13" fill="#1a7f37"/>
  <text x="466" y="91" font-size="12" fill="#fff">搜一下</text>

  <!-- 结果 1（自然结果） -->
  <rect x="44" y="114" width="470" height="64" rx="8" fill="#ffffff" stroke="#e6e8eb"/>
  <text x="58" y="136" font-size="13" fill="#0969da" font-weight="600">热销好物 Ten Reason why · 官方网站</text>
  <text x="58" y="156" font-size="11" fill="#57606a">为你精选全网优质内容，了解热销好物的相关信息与推荐理由…</text>
  <text x="58" y="170" font-size="10" fill="#8b949e">example-search.com</text>

  <!-- 结果 2（推广条目：网站自带小字 + 扩展红牌） -->
  <rect x="44" y="190" width="470" height="72" rx="8" fill="#ffffff" stroke="#e6e8eb"/>
  <text x="58" y="212" font-size="13" fill="#0969da" font-weight="600">XX精选商城 - 热销好物一站购齐</text>
  <text x="256" y="212" font-size="9" fill="#8b949e">广告</text>
  <text x="58" y="232" font-size="11" fill="#57606a">全网低价，限时优惠，今天下单立减，进入查看全部商品…</text>
  <text x="58" y="246" font-size="10" fill="#8b949e">xx-mall.example.com</text>
  <!-- 扩展小红牌 -->
  <rect x="470" y="236" width="36" height="18" rx="4" fill="#e5534b" stroke="#c93c37"/>
  <text x="477" y="249" font-size="11" fill="#ffffff" font-weight="700">广告</text>

  <!-- 结果 3（推广条目：扩展红牌 + 悬浮说明） -->
  <rect x="44" y="274" width="470" height="72" rx="8" fill="#ffffff" stroke="#e6e8eb"/>
  <text x="58" y="296" font-size="13" fill="#0969da" font-weight="600">好物严选平台 - 热销榜单</text>
  <text x="240" y="296" font-size="9" fill="#8b949e">推广</text>
  <text x="58" y="316" font-size="11" fill="#57606a">热销榜单每日更新，看看大家都在买什么，点击进入…</text>
  <text x="58" y="330" font-size="10" fill="#8b949e">haowu.example.com</text>
  <rect x="470" y="320" width="36" height="18" rx="4" fill="#e5534b" stroke="#c93c37"/>
  <text x="477" y="333" font-size="11" fill="#ffffff" font-weight="700">广告</text>
  <!-- 悬浮提示 -->
  <rect x="180" y="336" width="320" height="34" rx="6" fill="#1f2328" opacity="0.92"/>
  <text x="192" y="351" font-size="9" fill="#e6e8eb">本标记仅辅助区分付费推广：该条目是网页自带的推广标识</text>
  <text x="192" y="364" font-size="9" fill="#e6e8eb">（网站自己标注的「广告 / 推广 / 赞助」等），不自行判定。</text>

  <!-- 图例 -->
  <rect x="44" y="384" width="12" height="12" rx="3" fill="#e5534b"/>
  <text x="62" y="394" font-size="11" fill="#57606a">小红牌 = 本扩展添加的标记（仅本地显示）</text>
  <text x="300" y="394" font-size="11" fill="#8b949e">灰色小字 = 网站自带的推广标注</text>
  <text x="24" y="404" font-size="10" fill="#8b949e">※ 上图为效果示意图，非真实网页截图</text>
</svg>
