<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>付费推广标记（辅助）</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 300px; margin: 0; padding: 14px 16px;
    font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "HarmonyOS Sans SC", "Noto Sans SC", Roboto, sans-serif;
    color: #1f2328; background: #fff;
  }
  @media (prefers-color-scheme: dark) { body { color: #e6e8eb; background: #1c1f24; } }
  h1 { margin: 0 0 8px; font-size: 14px; }
  p { margin: 0 0 8px; font-size: 12px; color: #57606a; }
  .ok { display: inline-block; margin-bottom: 8px; padding: 2px 8px; border-radius: 999px; background: #e8f5ec; color: #1a7f37; font-size: 11px; }
  .note { margin: 0; padding-top: 8px; border-top: 1px solid #e6e8eb; font-size: 11px; color: #8b949e; }
</style>
</head>
<body>
  <h1>付费推广标记（辅助）</h1>
  <div class="ok">已在本地运行</div>
  <p>在网页<b>自带</b>的推广标识（网站自己标注的「广告 / 推广 / 赞助」等）条目右下角，显示一个小红牌「广告」；鼠标悬浮可看说明。<b>本标记仅辅助区分付费推广，不自行判定何为广告。</b></p>
  <p class="note"><b>免责声明：</b>本扩展为可选安装的本地可视化辅助工具——本标记仅辅助区分付费推广，标记出来的是网页自带的推广标识，本扩展不自行判定何为广告，也不拦截、不修改网页广告内容；可在扩展管理里随时卸载。</p>
</body>
</html>
